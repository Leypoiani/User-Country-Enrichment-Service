# =====================================================
# Configuração para Ambiente Docker
# =====================================================

# Configurações da Base de Dados
spring.datasource.url=jdbc:mysql://mysql:3306/usuario_db
spring.datasource.username=usuario_user
spring.datasource.password=usuario_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Pool de Conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# RandomUser API
randomuser.api.url=https://randomuser.me/api/
randomuser.api.timeout.connect=5000
randomuser.api.timeout.read=5000

# Logging
logging.level.root=INFO
logging.level.com.project.user_country_service=DEBUG
