name: CI - Develop to Main

on:
  push:
    branches:
      - develop

jobs:
  build-test-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Garantir permissão de execução do mvnw
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw clean verify

      - name: Criar PR para main
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: develop
          title: "Auto PR: develop → main"
          body: |
            Pull request criado automaticamente após CI em develop.