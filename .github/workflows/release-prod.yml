name: Release - Production

on:
  push:
    branches:
      - main

jobs:
  tag-release:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Criar tag de release
        run: |
          git tag v$(date +'%Y.%m.%d.%H%M')
          git push origin --tags
