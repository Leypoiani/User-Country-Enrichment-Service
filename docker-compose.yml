version: '3.8'

services:
  # Serviço MySQL
  mysql:
    image: mysql:8.0
    container_name: usuario-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: usuario_db
      MYSQL_USER: usuario_user
      MYSQL_PASSWORD: usuario_pass
    ports:
      - "3306:3306"
    volumes:
      # Volume para persistência de dados
      - mysql_data:/var/lib/mysql
      # Script de inicialização SQL
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - usuario-network

  # Serviço Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usuario-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuario_db
      SPRING_DATASOURCE_USERNAME: usuario_user
      SPRING_DATASOURCE_PASSWORD: usuario_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_APPLICATION_NAME: user-country-service
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - usuario-network

volumes:
  mysql_data:
    driver: local

networks:
  usuario-network:
    driver: bridge
